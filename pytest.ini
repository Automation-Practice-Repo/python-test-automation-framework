[pytest]
pythonpath = .
testpaths = ui_tests api_tests db_tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers

markers =
    ui: Playwright browser end-to-end UI tests
    api: REST API tests and endpoint assertions
    db: SQL and MongoDB backend validation tests
    smoke: Critical smoke tests for sanity checks
    regression: Full regression test suite
